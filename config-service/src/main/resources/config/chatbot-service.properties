server.port=8093
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.include-thoughts=false
spring.ai.retry.max-attempts=1
spring.ai.mcp.client.name=ebank-assistant
spring.ai.mcp.client.streamable-http.connections.customers.url=${CUSTOMER_MCP_URL:http://127.0.0.1:8081}
spring.ai.mcp.client.streamable-http.connections.accounts.url=${ACCOUNT_MCP_URL:http://127.0.0.1:8082}
