server.port=8080
spring.web.resources.static-locations=file:./frontend/dist/ebank/browser/
spring.cloud.gateway.server.webflux.routes[0].id=accounts
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ebank-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/accounts,/api/accounts/**
spring.cloud.gateway.server.webflux.routes[1].id=customers
spring.cloud.gateway.server.webflux.routes[1].uri=lb://customer-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/customers,/api/customers/**
spring.cloud.gateway.server.webflux.routes[2].id=chat
spring.cloud.gateway.server.webflux.routes[2].uri=lb://chatbot-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/chat
